<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rack List</title>
<style>
  :root {
    --border: #c0c0c0;
    --header-bg: #4472C4;
    --header-text: #fff;
    --row-even: #F5F5F5;
    --row-odd: #fff;
    --row-hover: #D9E6FF;
    --text: #1a1a1a;
    --dim: #555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Calibri, 'Segoe UI', Arial, sans-serif;
    font-size: 14px;
    background: #e8e8e8;
    color: var(--text);
    min-height: 100vh;
  }

  #gate {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .gate-box {
    background: #fff; border: 1px solid var(--border);
    border-radius: 8px; padding: 48px 40px; text-align: center;
    max-width: 400px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .gate-box h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .gate-box p { color: var(--dim); font-size: 14px; margin-bottom: 28px; }
  .gate-box input {
    width: 100%; padding: 14px 18px; background: #f8f8f8;
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 18px; text-align: center;
    letter-spacing: 4px; outline: none;
  }
  .gate-box input:focus { border-color: var(--header-bg); }
  .gate-box .error { color: #d32f2f; font-size: 13px; margin-top: 12px; display: none; }
  .gate-box .error.show { display: block; }

  #app { display: none; }
  #app.active { display: block; }

  header {
    background: #fff; border-bottom: 2px solid var(--header-bg);
    padding: 12px 20px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  header h1 { font-size: 16px; font-weight: 700; color: var(--header-bg); }
  header .meta { color: var(--dim); font-size: 11px; }

  .toolbar {
    padding: 8px 20px; display: flex; gap: 10px; flex-wrap: wrap;
    align-items: center; background: #fff; border-bottom: 1px solid var(--border);
  }
  .toolbar input[type=search] {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 3px;
    font-size: 13px; min-width: 200px; outline: none;
  }
  .toolbar input[type=search]:focus { border-color: var(--header-bg); }
  .toolbar .count { color: var(--dim); font-size: 12px; margin-left: auto; }

  .table-wrap {
    padding: 20px; overflow-x: auto;
  }
  table {
    border-collapse: collapse; font-size: 13px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  th {
    background: var(--header-bg); color: var(--header-text);
    font-weight: 600; text-align: center; padding: 8px 16px;
    border: 1px solid #3A5FA8; font-size: 12px; white-space: nowrap;
  }
  td {
    padding: 5px 16px; border: 1px solid var(--border);
    white-space: nowrap; text-align: center;
  }
  tr:nth-child(even) td { background: var(--row-even); }
  tr:nth-child(odd) td { background: var(--row-odd); }
  tr:hover td { background: var(--row-hover); }

  tr.highlight td { background: #FFF9C4 !important; }
  tr.highlight:hover td { background: #FFF176 !important; }

  .state-empty, .state-loading, .state-error {
    text-align: center; padding: 60px; color: var(--dim);
    background: #fff; border: 1px solid var(--border);
  }
  .state-error { color: #d32f2f; }

  footer {
    text-align: center; padding: 10px; color: var(--dim);
    font-size: 11px; background: #fff; border-top: 1px solid var(--border);
  }

  @media (max-width: 700px) {
    header { padding: 10px 12px; }
    .toolbar { padding: 6px 12px; }
    .toolbar input[type=search] { min-width: 0; flex: 1; }
    .table-wrap { padding: 12px 8px; }
    th, td { padding: 5px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>Access Required</h1>
    <p>Enter your access code to view the rack list.</p>
    <input type="password" id="code-input" placeholder="••••" maxlength="16" autofocus>
    <div class="error" id="gate-error">Invalid code. Try again.</div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Rack & Pinion List</h1>
    <span class="meta" id="last-updated"></span>
  </header>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search...">
    <span class="count" id="row-count"></span>
  </div>
  <div class="table-wrap" id="table-wrap"></div>
  <footer>Updated automatically from master list</footer>
</div>

<script>
const SHEET_CSV_URL = 'https://raw.githubusercontent.com/mohammad-ayesh/yard-portal/main/data.csv';
const VALID_CODES = new Set([]);
const OPEN_ACCESS = true;
const HIGHLIGHT_ROWS = 10;
const CACHE_MS = 5 * 60 * 1000;

const COLUMN_MAP = [
  ['Make',         'Make'],
  ['Model',        'Model'],
  ['Year of Make', 'Year of Make'],
  ['Sub Model',    'Sub Model'],
];

let allRows = [];

const gate = document.getElementById('gate');
const app = document.getElementById('app');
const codeInput = document.getElementById('code-input');
const gateError = document.getElementById('gate-error');
const urlParams = new URLSearchParams(window.location.search);
const urlCode = urlParams.get('code');

if (OPEN_ACCESS) {
  unlock();
} else if (urlCode && VALID_CODES.has(urlCode)) {
  unlock();
} else if (urlCode) {
  gateError.classList.add('show');
  gateError.textContent = 'Invalid bookmark.';
}

codeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (VALID_CODES.has(codeInput.value.trim())) {
      const url = new URL(window.location);
      url.searchParams.set('code', codeInput.value.trim());
      window.history.replaceState({}, '', url);
      unlock();
    } else {
      gateError.classList.add('show');
      codeInput.value = '';
    }
  }
});

function unlock() {
  gate.style.display = 'none';
  app.classList.add('active');
  loadData();
}

async function loadData() {
  const wrap = document.getElementById('table-wrap');
  wrap.innerHTML = '<div class="state-loading">Loading...</div>';

  try {
    const cached = sessionStorage.getItem('rack_data');
    const cachedTime = sessionStorage.getItem('rack_data_time');
    if (cached && cachedTime && (Date.now() - Number(cachedTime) < CACHE_MS)) {
      allRows = JSON.parse(cached);
    } else {
      const resp = await fetch(SHEET_CSV_URL);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();
      allRows = parseCSV(text);
      sessionStorage.setItem('rack_data', JSON.stringify(allRows));
      sessionStorage.setItem('rack_data_time', Date.now());
    }
    document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleString();
    renderTable();
  } catch (err) {
    wrap.innerHTML = `<div class="state-error">Could not load data. ${err.message}<br><small>Try refreshing.</small></div>`;
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = parseCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = parseCSVLine(lines[i]);
    if (vals.length === 0 || vals.every(v => !v)) continue;
    const row = {};
    headers.forEach((h, idx) => { row[h.trim()] = (vals[idx] || '').trim(); });
    rows.push(row);
  }
  return rows;
}

function parseCSVLine(line) {
  const result = [];
  let current = '', inQuotes = false;
  for (const ch of line) {
    if (inQuotes) { if (ch === '"') inQuotes = false; else current += ch; }
    else { if (ch === '"') inQuotes = true; else if (ch === ',') { result.push(current); current = ''; } else current += ch; }
  }
  result.push(current);
  return result;
}

function renderTable() {
  const searchTerm = document.getElementById('search').value.toLowerCase();
  let filtered = allRows;
  if (searchTerm) {
    filtered = allRows.filter(row =>
      Object.values(row).some(v => String(v).toLowerCase().includes(searchTerm))
    );
  }

  document.getElementById('row-count').textContent = `${filtered.length} of ${allRows.length} parts`;

  const wrap = document.getElementById('table-wrap');
  const cols = COLUMN_MAP;
  const ths = cols.map(([_, label]) => `<th>${label}</th>`).join('');
  const rows = filtered.map((row, idx) => {
    const hl = idx < HIGHLIGHT_ROWS ? ' class="highlight"' : '';
    const tds = cols.map(([key]) => `<td>${esc(row[key] || '')}</td>`).join('');
    return `<tr${hl}>${tds}</tr>`;
  }).join('');

  if (filtered.length === 0) {
    wrap.innerHTML = '<div class="state-empty">No matching parts found.</div>';
  } else {
    wrap.innerHTML = `<table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>`;
  }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('search').addEventListener('input', renderTable);

setInterval(() => {
  if (app.classList.contains('active')) {
    sessionStorage.removeItem('rack_data');
    loadData();
  }
}, CACHE_MS);
</script>
</body>
</html>
