<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rack List</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #e0e0e0;
    --dim: #888;
    --accent: #f0a030;
    --accent-dim: #b07010;
    --green: #2ecc71;
    --red: #e74c3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Gate Screen ── */
  #gate {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .gate-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 40px;
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
  .gate-box h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .gate-box p { color: var(--dim); font-size: 14px; margin-bottom: 28px; }
  .gate-box input {
    width: 100%; padding: 14px 18px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 18px;
    text-align: center; letter-spacing: 4px; outline: none;
    transition: border-color .2s;
  }
  .gate-box input:focus { border-color: var(--accent); }
  .gate-box .error {
    color: var(--red); font-size: 13px; margin-top: 12px; display: none;
  }
  .gate-box .error.show { display: block; }

  /* ── Main App ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  #app.active { display: flex; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .meta { color: var(--dim); font-size: 12px; }

  .toolbar {
    padding: 12px 24px; display: flex; gap: 12px; flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input[type=search] {
    padding: 8px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 14px; min-width: 240px; outline: none;
  }
  .toolbar input[type=search]:focus { border-color: var(--accent); }
  .toolbar .count { color: var(--dim); font-size: 13px; margin-left: auto; }

  .table-wrap { padding: 0 24px 24px; overflow-x: auto; flex: 1; }
  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
    white-space: nowrap;
  }
  thead { position: sticky; top: 57px; z-index: 5; }
  th {
    background: var(--surface); color: var(--dim);
    font-weight: 600; text-align: left; padding: 10px 14px;
    border-bottom: 2px solid var(--border); cursor: pointer;
    user-select: none; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  th:hover { color: var(--text); }
  th .arrow { margin-left: 4px; opacity: 0.4; }
  th.sorted .arrow { opacity: 1; color: var(--accent); }
  th.sorted.desc .arrow::after { content: ' ▼'; }
  th.sorted.asc .arrow::after { content: ' ▲'; }

  td { padding: 8px 14px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .state-empty, .state-loading, .state-error {
    text-align: center; padding: 80px 20px; color: var(--dim);
  }
  .state-error { color: var(--red); }
  .state-loading::after { content: '...'; animation: dots 1.5s steps(4,end) infinite; }
  @keyframes dots { 0%{content:'.'} 25%{content:'..'} 50%{content:'...'} 75%{content:'....'} }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; background: var(--accent-dim);
    color: #fff;
  }

  footer {
    text-align: center; padding: 16px; color: var(--dim);
    font-size: 11px; border-top: 1px solid var(--border);
  }

  @media (max-width: 600px) {
    .gate-box { padding: 32px 20px; }
    header { padding: 12px 16px; }
    .toolbar { padding: 10px 16px; }
    .toolbar input[type=search] { min-width: 0; flex: 1; }
    .table-wrap { padding: 0 8px 16px; }
    th, td { padding: 6px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- ═══════════ GATE ═══════════ -->
<div id="gate">
  <div class="gate-box">
    <h1>🔐 Access Required</h1>
    <p>Enter your access code to view the rack list.</p>
    <input type="password" id="code-input" placeholder="••••" maxlength="16" autofocus>
    <div class="error" id="gate-error">Invalid code. Try again.</div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">
  <header>
    <h1>📋 Rack & Pinion List</h1>
    <span class="meta" id="last-updated"></span>
  </header>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search part#, vehicle, year...">
    <span class="count" id="row-count"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="state-empty" id="empty-msg" style="display:none">No matching parts found.</div>
  </div>
  <footer>Updated live from master list</footer>
</div>

<script>
// ═══════════════════════════════════════
// CONFIGURATION — Edit these
// ═══════════════════════════════════════

// Google Sheets published CSV URL (File → Share → Publish to web → CSV)
const SHEET_CSV_URL = 'https://raw.githubusercontent.com/mohammad-ayesh/yard-portal/main/data.csv';

// Valid access codes — one per yard. Change these, add more as needed.
// Each yard gets ONE code. Codes are case-sensitive.
// Set to empty array for open access (anyone with the link can view).
const VALID_CODES = new Set([
  // Add codes here when ready
]);
const OPEN_ACCESS = true;  // Change to false when you want passcode protection

// How column headers from your sheet map to display names.
// Keys = exact header text from your sheet (row 1).
// Values = display name. Leave empty string to hide the column.
const COLUMN_MAP = {
  'Make':          'Make',
  'Model':         'Model',
  'Year of Make':  'Year',
  'Sub Model':     'Sub Model',
};

// How long to cache data (milliseconds). Default: 5 minutes.
const CACHE_MS = 5 * 60 * 1000;

// ═══════════════════════════════════════
// APP LOGIC
// ═══════════════════════════════════════

let allRows = [];
let sortCol = null;
let sortAsc = true;

// ── Gate ──
const gate = document.getElementById('gate');
const app = document.getElementById('app');
const codeInput = document.getElementById('code-input');
const gateError = document.getElementById('gate-error');

// Check URL param first
const urlParams = new URLSearchParams(window.location.search);
const urlCode = urlParams.get('code');

if (OPEN_ACCESS) {
  unlock();
} else if (urlCode && VALID_CODES.has(urlCode)) {
  unlock();
} else if (urlCode) {
  gateError.classList.add('show');
  gateError.textContent = 'Invalid bookmark. Ask for a new link.';
}

codeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (VALID_CODES.has(codeInput.value.trim())) {
      // Update URL without reload
      const url = new URL(window.location);
      url.searchParams.set('code', codeInput.value.trim());
      window.history.replaceState({}, '', url);
      unlock();
    } else {
      gateError.classList.add('show');
      codeInput.value = '';
    }
  }
});

function unlock() {
  gate.style.display = 'none';
  app.classList.add('active');
  loadData();
}

// ── Data loading ──
async function loadData() {
  const body = document.getElementById('table-body');
  body.innerHTML = '<tr><td colspan="10" class="state-loading">Loading</td></tr>';

  try {
    // Try cache first
    const cached = sessionStorage.getItem('rack_data');
    const cachedTime = sessionStorage.getItem('rack_data_time');
    if (cached && cachedTime && (Date.now() - Number(cachedTime) < CACHE_MS)) {
      allRows = JSON.parse(cached);
    } else {
      const resp = await fetch(SHEET_CSV_URL);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();
      allRows = parseCSV(text);
      sessionStorage.setItem('rack_data', JSON.stringify(allRows));
      sessionStorage.setItem('rack_data_time', Date.now());
    }

    document.getElementById('last-updated').textContent =
      'Updated: ' + new Date().toLocaleString();
    renderTable();
  } catch (err) {
    body.innerHTML = `<tr><td colspan="10" class="state-error">
      Could not load data. ${err.message}<br>
      <small>Try refreshing the page.</small>
    </td></tr>`;
    console.error('Load error:', err);
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];

  const headers = parseCSVLine(lines[0]);
  const rows = [];

  for (let i = 1; i < lines.length; i++) {
    const vals = parseCSVLine(lines[i]);
    if (vals.length === 0 || vals.every(v => !v)) continue;
    const row = {};
    headers.forEach((h, idx) => { row[h.trim()] = (vals[idx] || '').trim(); });
    rows.push(row);
  }
  return rows;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (const ch of line) {
    if (inQuotes) {
      if (ch === '"') { inQuotes = false; }
      else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { result.push(current); current = ''; }
      else { current += ch; }
    }
  }
  result.push(current);
  return result;
}

// ── Rendering ──
function renderTable() {
  const searchTerm = document.getElementById('search').value.toLowerCase();
  let filtered = allRows;
  if (searchTerm) {
    filtered = allRows.filter(row =>
      Object.values(row).some(v => String(v).toLowerCase().includes(searchTerm))
    );
  }

  // Sort
  if (sortCol !== null) {
    filtered.sort((a, b) => {
      const va = (a[sortCol] || '').toString().toLowerCase();
      const vb = (b[sortCol] || '').toString().toLowerCase();
      // Numeric sort if both look like numbers
      const na = parseFloat(va), nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb) && va === String(na) && vb === String(nb)) {
        return sortAsc ? na - nb : nb - na;
      }
      return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }

  document.getElementById('row-count').textContent =
    `${filtered.length} of ${allRows.length} parts`;

  // Build headers
  const headRow = document.getElementById('table-head');
  const visibleCols = Object.entries(COLUMN_MAP).filter(([_, label]) => label !== '');
  headRow.innerHTML = visibleCols.map(([key, label]) => {
    const cls = sortCol === key ? (sortAsc ? 'sorted asc' : 'sorted desc') : '';
    return `<th class="${cls}" data-col="${key}">${label}<span class="arrow"></span></th>`;
  }).join('');

  // Build body
  const body = document.getElementById('table-body');
  const empty = document.getElementById('empty-msg');

  if (filtered.length === 0) {
    body.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = searchTerm ? 'No matching parts found.' : 'No parts in list yet.';
  } else {
    empty.style.display = 'none';
    body.innerHTML = filtered.map(row =>
      `<tr>${visibleCols.map(([key]) => {
        const val = row[key] || '';
        // Highlight part numbers
        const isPart = key.includes('#') || key.toLowerCase().includes('part');
        return `<td>${isPart ? `<span class="badge">${esc(val)}</span>` : esc(val)}</td>`;
      }).join('')}</tr>`
    ).join('');
  }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Sorting ──
document.getElementById('table-head').addEventListener('click', e => {
  const th = e.target.closest('th');
  if (!th) return;
  const col = th.dataset.col;
  if (sortCol === col) {
    sortAsc = !sortAsc;
  } else {
    sortCol = col;
    sortAsc = true;
  }
  renderTable();
});

// ── Search ──
document.getElementById('search').addEventListener('input', () => {
  renderTable();
});

// ── Periodic refresh (every 5 min) ──
setInterval(() => {
  if (app.classList.contains('active')) {
    sessionStorage.removeItem('rack_data');
    loadData();
  }
}, CACHE_MS);
</script>
</body>
</html>
