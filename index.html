<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rack List</title>
<style>
  :root {
    --border: #d0d0d0;
    --header-bg: #4472C4;
    --header-text: #ffffff;
    --row-even: #F2F2F2;
    --row-odd: #ffffff;
    --row-hover: #D9E6FF;
    --text: #1a1a1a;
    --dim: #555;
    --accent: #4472C4;
    --highlight: #FFFF00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Calibri, 'Segoe UI', Arial, sans-serif;
    font-size: 14px;
    background: #e8e8e8;
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Gate Screen ── */
  #gate {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .gate-box {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 48px 40px;
    text-align: center;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .gate-box h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .gate-box p { color: var(--dim); font-size: 14px; margin-bottom: 28px; }
  .gate-box input {
    width: 100%; padding: 14px 18px;
    background: #f8f8f8; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 18px;
    text-align: center; letter-spacing: 4px; outline: none;
    transition: border-color .2s;
  }
  .gate-box input:focus { border-color: var(--accent); }
  .gate-box .error {
    color: #d32f2f; font-size: 13px; margin-top: 12px; display: none;
  }
  .gate-box .error.show { display: block; }

  /* ── Main App ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  #app.active { display: flex; }

  header {
    background: #fff; border-bottom: 2px solid var(--accent);
    padding: 12px 24px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 12px;
    position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  header h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
  header .meta { color: var(--dim); font-size: 12px; }

  .toolbar {
    padding: 10px 24px; display: flex; gap: 12px; flex-wrap: wrap;
    align-items: center; background: #fff; border-bottom: 1px solid var(--border);
  }
  .toolbar input[type=search] {
    padding: 7px 12px; background: #fff;
    border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); font-size: 13px; min-width: 240px; outline: none;
  }
  .toolbar input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(68,114,196,0.15); }
  .toolbar .count { color: var(--dim); font-size: 12px; margin-left: auto; }

  .table-wrap {
    margin: 0 24px 24px; overflow-x: auto; flex: 1;
    background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  thead { position: sticky; top: 47px; z-index: 5; }
  th {
    background: var(--header-bg); color: var(--header-text);
    font-weight: 600; text-align: left; padding: 8px 10px;
    border: 1px solid #3A5FA8; cursor: pointer;
    user-select: none; font-size: 12px; white-space: nowrap;
  }
  th:hover { background: #5B8BD4; }
  th .arrow { margin-left: 3px; opacity: 0.6; }
  th.sorted .arrow { opacity: 1; }
  th.sorted.desc .arrow::after { content: ' ▼'; }
  th.sorted.asc .arrow::after { content: ' ▲'; }

  td {
    padding: 5px 10px; border: 1px solid var(--border);
    white-space: nowrap;
  }
  tr:nth-child(even) td { background: var(--row-even); }
  tr:nth-child(odd) td { background: var(--row-odd); }
  tr:hover td { background: var(--row-hover) !important; }

  /* ── Highlight rows 1-10 (yellow like MO's Excel) ── */
  tr.highlight td { background: #FFF9C4 !important; }
  tr.highlight:hover td { background: #FFF176 !important; }

  .state-empty, .state-loading, .state-error {
    text-align: center; padding: 80px 20px; color: var(--dim);
    background: #fff;
  }
  .state-error { color: #d32f2f; }

  footer {
    text-align: center; padding: 12px; color: var(--dim);
    font-size: 11px; background: #fff; border-top: 1px solid var(--border);
  }

  @media (max-width: 700px) {
    .gate-box { padding: 32px 20px; }
    header { padding: 10px 14px; }
    .toolbar { padding: 8px 14px; }
    .toolbar input[type=search] { min-width: 0; flex: 1; }
    .table-wrap { margin: 0 8px 12px; }
    th, td { padding: 4px 8px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- ═══════════ GATE ═══════════ -->
<div id="gate">
  <div class="gate-box">
    <h1>Access Required</h1>
    <p>Enter your access code to view the rack list.</p>
    <input type="password" id="code-input" placeholder="••••" maxlength="16" autofocus>
    <div class="error" id="gate-error">Invalid code. Try again.</div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">
  <header>
    <h1>Rack & Pinion List</h1>
    <span class="meta" id="last-updated"></span>
  </header>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search...">
    <span class="count" id="row-count"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="state-empty" id="empty-msg" style="display:none">No matching parts found.</div>
  </div>
  <footer>Updated automatically from master list</footer>
</div>

<script>
// ═══════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════

const SHEET_CSV_URL = 'https://raw.githubusercontent.com/mohammad-ayesh/yard-portal/main/data.csv';

const VALID_CODES = new Set([]);
const OPEN_ACCESS = true;

const COLUMN_MAP = {
  'Make':          'Make',
  'Model':         'Model',
  'Year of Make':  'Year',
  'Sub Model':     'Sub Model',
};

// How many rows to highlight yellow (matches MO's Excel)
const HIGHLIGHT_ROWS = 10;

const CACHE_MS = 5 * 60 * 1000;

// ═══════════════════════════════════════
// APP LOGIC
// ═══════════════════════════════════════

let allRows = [];
let sortCol = null;
let sortAsc = true;

const gate = document.getElementById('gate');
const app = document.getElementById('app');
const codeInput = document.getElementById('code-input');
const gateError = document.getElementById('gate-error');

const urlParams = new URLSearchParams(window.location.search);
const urlCode = urlParams.get('code');

if (OPEN_ACCESS) {
  unlock();
} else if (urlCode && VALID_CODES.has(urlCode)) {
  unlock();
} else if (urlCode) {
  gateError.classList.add('show');
  gateError.textContent = 'Invalid bookmark. Ask for a new link.';
}

codeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (VALID_CODES.has(codeInput.value.trim())) {
      const url = new URL(window.location);
      url.searchParams.set('code', codeInput.value.trim());
      window.history.replaceState({}, '', url);
      unlock();
    } else {
      gateError.classList.add('show');
      codeInput.value = '';
    }
  }
});

function unlock() {
  gate.style.display = 'none';
  app.classList.add('active');
  loadData();
}

async function loadData() {
  const body = document.getElementById('table-body');
  body.innerHTML = '<tr><td colspan="10" class="state-loading">Loading...</td></tr>';

  try {
    const cached = sessionStorage.getItem('rack_data');
    const cachedTime = sessionStorage.getItem('rack_data_time');
    if (cached && cachedTime && (Date.now() - Number(cachedTime) < CACHE_MS)) {
      allRows = JSON.parse(cached);
    } else {
      const resp = await fetch(SHEET_CSV_URL);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();
      allRows = parseCSV(text);
      sessionStorage.setItem('rack_data', JSON.stringify(allRows));
      sessionStorage.setItem('rack_data_time', Date.now());
    }

    document.getElementById('last-updated').textContent =
      'Updated: ' + new Date().toLocaleString();
    renderTable();
  } catch (err) {
    body.innerHTML = `<tr><td colspan="10" class="state-error">
      Could not load data. ${err.message}<br>
      <small>Try refreshing the page.</small>
    </td></tr>`;
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = parseCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = parseCSVLine(lines[i]);
    if (vals.length === 0 || vals.every(v => !v)) continue;
    const row = {};
    headers.forEach((h, idx) => { row[h.trim()] = (vals[idx] || '').trim(); });
    rows.push(row);
  }
  return rows;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (const ch of line) {
    if (inQuotes) {
      if (ch === '"') { inQuotes = false; }
      else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { result.push(current); current = ''; }
      else { current += ch; }
    }
  }
  result.push(current);
  return result;
}

function renderTable() {
  const searchTerm = document.getElementById('search').value.toLowerCase();
  let filtered = allRows;
  if (searchTerm) {
    filtered = allRows.filter(row =>
      Object.values(row).some(v => String(v).toLowerCase().includes(searchTerm))
    );
  }

  if (sortCol !== null) {
    filtered.sort((a, b) => {
      const va = (a[sortCol] || '').toString().toLowerCase();
      const vb = (b[sortCol] || '').toString().toLowerCase();
      const na = parseFloat(va), nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb) && va === String(na) && vb === String(nb)) {
        return sortAsc ? na - nb : nb - na;
      }
      return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }

  document.getElementById('row-count').textContent =
    `${filtered.length} of ${allRows.length} parts`;

  const headRow = document.getElementById('table-head');
  const visibleCols = Object.entries(COLUMN_MAP).filter(([_, label]) => label !== '');
  headRow.innerHTML = visibleCols.map(([key, label]) => {
    const cls = sortCol === key ? (sortAsc ? 'sorted asc' : 'sorted desc') : '';
    return `<th class="${cls}" data-col="${key}">${label}<span class="arrow"></span></th>`;
  }).join('');

  const body = document.getElementById('table-body');
  const empty = document.getElementById('empty-msg');

  if (filtered.length === 0) {
    body.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = searchTerm ? 'No matching parts found.' : 'No parts in list yet.';
  } else {
    empty.style.display = 'none';
    body.innerHTML = filtered.map((row, idx) => {
      const hl = idx < HIGHLIGHT_ROWS ? ' class="highlight"' : '';
      return `<tr${hl}>${visibleCols.map(([key]) =>
        `<td>${esc(row[key] || '')}</td>`
      ).join('')}</tr>`;
    }).join('');
  }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('table-head').addEventListener('click', e => {
  const th = e.target.closest('th');
  if (!th) return;
  const col = th.dataset.col;
  sortCol = col;
  sortAsc = sortCol === col ? !sortAsc : true;
  if (sortCol !== col) { sortCol = col; sortAsc = true; }
  renderTable();
});

document.getElementById('search').addEventListener('input', () => renderTable());

setInterval(() => {
  if (app.classList.contains('active')) {
    sessionStorage.removeItem('rack_data');
    loadData();
  }
}, CACHE_MS);
</script>
</body>
</html>
